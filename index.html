<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicious Bites - Restaurant App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <h1 class="logo" onclick="showPage('home')">🍽️ Kobem Todos</h1>
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
            <nav id="nav">
                <a href="#" onclick="showPage('home')">Home</a>
                <a href="#" onclick="showPage('menu')">Menu</a>
                <a href="#" onclick="showPage('orders')">Orders</a>
                <a href="#" onclick="showPage('cart')" class="cart-link">
                    🛒 Cart
                    <span id="cart-badge" class="cart-badge">0</span>
                </a>
                <div id="user-section">
                    <a href="#" onclick="showPage('login')" id="login-btn">Login</a>
                    <div id="user-info" style="display: none;">
                        <span id="user-name"></span>
                        <button onclick="logout()">Logout</button>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Home Page -->
        <div id="home-page" class="page">
            <div class="hero">
                <h1>🍽️ Kobem Todos</h1>
                <p>Fresh, Fast & Flavorful</p>
                <div class="hero-image">🍕🍔🍝</div>
                <button class="btn-primary" onclick="showPage('menu')">View Menu</button>
            </div>
        </div>

        <!-- Menu Page -->
        <div id="menu-page" class="page" style="display: none;">
            <h2>Our Menu</h2>
            <div id="menu-container"></div>
        </div>

        <!-- Cart Page -->
        <div id="cart-page" class="page" style="display: none;">
            <h2>Shopping Cart</h2>
            <div id="cart-container"></div>
        </div>

        <!-- Orders Page -->
        <div id="orders-page" class="page" style="display: none;">
            <h2>My Orders</h2>
            <div id="orders-container"></div>
        </div>

        <!-- Login Page -->
        <div id="login-page" class="page" style="display: none;">
            <div class="auth-form">
                <h2>Login</h2>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password">
                </div>
                <button class="btn-primary" onclick="handleLogin()">Login</button>
                <p class="auth-link">
                    Don't have an account? 
                    <a href="#" onclick="showPage('signup')">Sign up</a>
                </p>
            </div>
        </div>

        <!-- Signup Page -->
        <div id="signup-page" class="page" style="display: none;">
            <div class="auth-form">
                <h2>Sign Up</h2>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="signup-name" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signup-email" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" placeholder="Create a password">
                </div>
                <button class="btn-primary" onclick="handleSignup()">Sign Up</button>
                <p class="auth-link">
                    Already have an account? 
                    <a href="#" onclick="showPage('login')">Login</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>© 2024 Delicious Bites. All rights reserved.</p>
            <p>Fresh food delivered to your door</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
